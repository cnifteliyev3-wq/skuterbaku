<!doctype html>
<html lang="az"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Skuter İcarə Paneli</title>
<meta name="robots" content="noindex,nofollow">
<style>.pmrow{display:flex!important;flex-direction:row!important;align-items:flex-start!important;justify-content:flex-start!important;gap:10px;font-weight:500;text-align:left}.pmrow input{width:auto!important;min-height:0!important;flex:none;margin:3px 0 0!important}.pmrow span{flex:1}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dark navy sidebar (bottom tab bar on phones) + light work area; scooter cards carry a status stripe, money shown as a 3-cell strip. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#eaedf3; --ink:#111a2e; --muted:#5b667d; --line:#dbe0ea;
  --accent:#d9480f; --accent-ink:#ffffff; --accent-soft:#ffe9dc;
  --side:#0f1930; --side-ink:#aeb8d0; --side-on:#ffffff;
  --ok:#0f7b4f; --ok-soft:#d8f0e5; --warn:#9a5b00; --warn-soft:#fbebc9; --bad:#b42318; --bad-soft:#fbdcd8;
  --display:'Sora','Segoe UI',system-ui,sans-serif; --body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#141b30; --surface2:#1c2540; --ink:#e8ecf6; --muted:#97a3bf; --line:#27314d;
  --accent:#ff8a4c; --accent-ink:#1a0a00; --accent-soft:#3b2314; --side:#080d1b; --side-ink:#8d99b6;
  --ok:#5fd29a; --ok-soft:#14392b; --warn:#f0b955; --warn-soft:#3f3110; --bad:#ff8f84; --bad-soft:#4a1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#141b30; --surface2:#1c2540; --ink:#e8ecf6; --muted:#97a3bf; --line:#27314d;
  --accent:#ff8a4c; --accent-ink:#1a0a00; --accent-soft:#3b2314; --side:#080d1b; --side-ink:#8d99b6;
  --ok:#5fd29a; --ok-soft:#14392b; --warn:#f0b955; --warn-soft:#3f3110; --bad:#ff8f84; --bad-soft:#4a1d19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;align-self:start;height:100vh;padding:26px 14px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:11px;color:var(--side-on);padding:0 8px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font:700 16px/1.15 var(--display);letter-spacing:.01em}
.brand small{display:block;font:500 11.5px var(--body);color:var(--side-ink);letter-spacing:.04em}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:14px;border-left:3px solid transparent}
nav a[data-t="ayarlar"]{order:9}
nav a svg{width:19px;height:19px;flex:none}
nav a:hover{background:rgba(255,255,255,.06);color:var(--side-on)}
nav a[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--side-on);border-left-color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:30px max(24px,env(safe-area-inset-right,0px)) 60px 32px;display:flex;flex-direction:column;gap:24px;max-width:1120px;width:100%}
h2{font:700 22px/1.2 var(--display);margin:0;letter-spacing:-.01em}
h3{font:700 16px/1.3 var(--display);margin:0}
.section-t{font:700 13px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:12px;padding:16px 18px;min-width:0}
.tile:nth-child(2){border-top-color:var(--ok)} .tile:nth-child(3){border-top-color:var(--bad)} .tile:nth-child(4){border-top-color:var(--accent)}
.tile .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font:700 28px/1.2 var(--display);font-variant-numeric:tabular-nums;margin:6px 0 2px}
.tile .s{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--line)}
.card.st-ok::before{background:var(--ok)} .card.st-acc::before{background:var(--accent)} .card.st-warn::before{background:var(--warn)} .card.st-bad::before{background:var(--bad)} .card.st-mute::before{background:var(--muted)}
.card .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-top:4px}
.plate{display:inline-block;margin-top:5px;font:500 12px var(--mono);letter-spacing:.08em;color:var(--ink);background:var(--surface2);border:1.5px solid var(--ink);border-radius:5px;padding:1px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--surface2);color:var(--muted)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.money{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.money div{padding:9px 10px;min-width:0} .money div+div{border-left:1px solid var(--line)}
.money small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.money b{font:700 15px var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.debt{color:var(--bad);font-weight:700} .credit{color:var(--ok);font-weight:700}
button,.btn{font:700 13.5px var(--body);padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--surface2)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} button.primary:hover{filter:brightness(1.07);background:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.sm{padding:6px 11px;font-size:13px}
button:disabled{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{border:0;background:transparent;color:var(--muted)} .seg button:hover{background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center}
.alert.warn{border-left-color:var(--warn)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted);background:var(--surface)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;background:var(--surface2);font-weight:700}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px}
.sub{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.sub div{display:flex;justify-content:space-between;gap:10px}
#modal{position:fixed;inset:0;background:rgba(8,13,27,.62);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 40px}
#modal[hidden]{display:none}
#modal form{background:var(--surface);border-radius:16px;padding:24px;width:min(540px,100%);display:grid;gap:14px;margin-top:4vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0} .f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr} @media(max-width:460px){.two{grid-template-columns:1fr}}
input,select,textarea{font:15px var(--body);padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
/* Ödənişlər: öz teal rəng sxemi və kart/lent düzümü */
.pay{--pa:#0f766e;--pa-soft:#d5f3ee;display:flex;flex-direction:column;gap:26px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pay{--pa:#2dd4bf;--pa-soft:#12403b}}
:root[data-theme="dark"] .pay{--pa:#2dd4bf;--pa-soft:#12403b}
.ptitle{font:700 12.5px/1 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--pa);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.ptitle::after{content:"";flex:1;height:1px;background:var(--line)}
button.pbtn{background:#0f766e;border-color:#0f766e;color:#fff}
button.pbtn:hover{background:#0c5f59;filter:none}
.pay-hero{background:linear-gradient(135deg,#0f766e 0%,#0c4a6e 100%);color:#fff;border-radius:20px;padding:24px;display:grid;gap:22px;position:relative;overflow:hidden}
.pay-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.pay-hero>*{position:relative;z-index:1}
.hl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:700}
.hbig{font:700 40px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.hsel{min-width:150px}.hsel label{color:rgba(255,255,255,.8)}
.hsel select{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.hsel select option{color:#111}
.hgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hs{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;min-width:0}
.hs span{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.8;font-weight:700}
.hs b{display:block;font:700 21px var(--display);font-variant-numeric:tabular-nums;margin:3px 0 1px;overflow-wrap:anywhere}
.hs small{opacity:.75;font-size:12px}
.duegrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.due{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--pa);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.due.late{border-left-color:var(--bad)}
.due .dm{flex:1 1 140px;min-width:0}.due .dm small{display:block;color:var(--muted)}
.due .da{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.scgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sc .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.sc .bar i{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#0ea5e9);border-radius:99px}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mets small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mets b{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.sc.total{background:linear-gradient(135deg,#0f766e,#0c4a6e);color:#fff;border-color:transparent}
.sc.total .mets small{color:rgba(255,255,255,.75)}
.feed{display:flex;flex-direction:column;gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dh{display:flex;justify-content:space-between;padding:10px 16px;background:var(--pa-soft);font-size:13.5px}
.dh span{color:var(--pa);font-weight:700;font-variant-numeric:tabular-nums}
.tx{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.tx .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font:700 16px var(--display);flex:none}
.k-kira{background:#0f766e}.k-cer{background:#d97706}.k-dep{background:#2563eb}.k-ret{background:#7c3aed}.k-guz{background:#16a34a}
.tx .tm{flex:1;min-width:0}.tx .tm small{display:block;color:var(--muted);overflow-wrap:anywhere}
.tx .ta{font:700 16px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .ta.neg{color:var(--bad)}
/* Ödəniş cədvəli */
.sstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sstrip>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);min-width:0}
.sstrip small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sstrip b{font:700 18px var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sstrip .bad b{color:var(--bad)}.sstrip .warn b{color:var(--warn)}.sstrip .ok b{color:var(--ok)}
.sprog{display:flex;align-items:center;gap:12px}
.sprog .bar{flex:1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.sprog .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.slist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding-right:2px;position:relative}
.srow{display:grid;grid-template-columns:34px minmax(110px,1.1fr) minmax(90px,1fr) minmax(110px,1.1fr) auto;gap:10px 14px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.srow small{display:block;color:var(--muted);font-size:12px}
.srow .sn{font:700 13px var(--mono);color:var(--muted);text-align:center}
.srow .sd b{font-size:14.5px}
.srow .sa b{font:700 17px var(--display);font-variant-numeric:tabular-nums}
.srow .sb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.srow.s-ok{border-left-color:var(--ok);background:var(--ok-soft)}
.srow.s-bad{border-left-color:var(--bad);background:var(--bad-soft)}
.srow.s-warn{border-left-color:var(--warn);background:var(--warn-soft);box-shadow:0 0 0 2px var(--warn) inset}
.srow.s-mute{border-left-color:var(--muted)}
@media(max-width:640px){.srow{grid-template-columns:30px 1fr auto}.srow .ss{grid-column:2 / 3}.srow .sb{grid-column:1 / -1;justify-content:flex-start}}
.grid.one{grid-template-columns:1fr}
/* Ödənişlər: skuter blokları alt-alta */
.scstack{display:flex;flex-direction:column;gap:18px}
.scb{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:16px;overflow:hidden}
.scb.st-ok{border-left-color:var(--ok)}.scb.st-warn{border-left-color:var(--warn)}.scb.st-bad{border-left-color:var(--bad)}.scb.st-mute{border-left-color:var(--muted)}
.scb-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface2)}
.scb-h .scn{width:34px;height:34px;border-radius:10px;background:var(--pa);color:#fff;display:grid;place-items:center;font:700 15px var(--display);flex:none}
.scb-t{flex:1;min-width:0}.scb-t b{font:700 17px var(--display)}.scb-t small{display:block;color:var(--muted)}
.lines{display:flex;flex-direction:column}
.ln{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 16px;border-top:1px solid var(--line)}
.ln .lt{min-width:0}.ln .lt b{font-size:14.5px}.ln .lt small{display:block;color:var(--muted);font-size:12.5px}
.ln .lv{font:700 17px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.lv.badc{color:var(--bad)}.lv.okc{color:var(--ok)}
.verd{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-top:2px solid var(--line)}
.verd small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.8}
.verd span{font-size:14.5px;font-weight:600}
.verd b{font:700 26px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.verd.ok{background:var(--ok-soft);color:var(--ok)}.verd.warn{background:var(--warn-soft);color:var(--warn)}.verd.bad{background:var(--bad-soft);color:var(--bad)}.verd.mute{background:var(--surface2);color:var(--muted)}
.scb.total{border-left-width:8px;border-color:var(--pa);border-left-color:var(--pa);box-shadow:0 0 0 2px var(--pa)}
.scb.total .scb-h{background:linear-gradient(135deg,#0f766e,#0c4a6e);color:#fff}
.scb.total .scb-t small{color:rgba(255,255,255,.8)}
.scb.total .scn{background:rgba(255,255,255,.2)}
@media(max-width:560px){.ln{flex-wrap:wrap}.verd{flex-direction:column;align-items:flex-start}}
/* Ödənişlər: sətir-sətir siyahı */
.plist{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.plh,.plr{display:grid;grid-template-columns:minmax(160px,1.6fr) repeat(7,minmax(0,1fr));gap:8px;padding:12px 14px;align-items:center}
.plh{background:var(--surface2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.plh .c,.plr .c{text-align:right;font-variant-numeric:tabular-nums}
.plr{border-top:1px solid var(--line);border-left:5px solid transparent}
.plr.late{border-left-color:var(--bad);background:var(--bad-soft)}
.plr .nm{display:flex;align-items:center;gap:10px;min-width:0}
.plr .nm small{display:block;color:var(--muted);overflow-wrap:anywhere}
.plr .no{width:28px;height:28px;border-radius:8px;background:var(--pa);color:#fff;display:grid;place-items:center;font:700 13px var(--display);flex:none}
.plr .c{font-weight:600}
.plr .c.fin{font:700 16px var(--display)}
.plr.total{background:var(--pa-soft);border-top:2px solid var(--pa);border-left-color:var(--pa)}
.plr.total .c{font-weight:700}
.badc{color:var(--bad)}.okc{color:var(--ok)}
@media(max-width:820px){
  .plh{display:none}
  .plr{grid-template-columns:1fr 1fr}
  .plr .nm{grid-column:1 / -1}
  .plr .c{text-align:left;display:flex;flex-direction:column}
  .plr .c::before{content:attr(data-l);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
}
.dtab tr.idle td{background:var(--surface2);color:var(--muted)}
/* İllik doluluq təqvimi */
.mons{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr))}
.mon{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{font-size:9.5px;text-align:center;color:var(--muted);font-weight:700}
.cal .d,.legend .d{display:grid;place-items:center;font-size:11px;border-radius:5px;aspect-ratio:1}
.d.full{background:var(--ok);color:var(--surface)}
.d.part{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.d.idle{background:var(--surface2);color:var(--muted)}
.d.fut{border:1px dashed var(--line);color:var(--muted);opacity:.6}
.mon .ms{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .d{width:18px;height:18px;aspect-ratio:auto;display:inline-block}
@media(max-width:820px){nav a{font-size:10.5px;padding:7px 0}}
.mgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.mth{display:block;text-decoration:none;color:var(--ink)}
.mth img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.mth span{display:grid;place-items:center;width:84px;height:64px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:12px;text-align:center;padding:4px;overflow:hidden}
.err{color:var(--bad);font-size:13px}
@media(max-width:820px){
  .shell{display:block}
  .side{position:fixed;inset:auto 0 0 0;height:auto;z-index:40;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));flex-direction:row;gap:0}
  .brand{display:none}
  nav{flex-direction:row;width:100%;gap:2px}
  nav a{flex:1;flex-direction:column;gap:3px;font-size:11.5px;padding:7px 2px;border-left:0;border-top:3px solid transparent;border-radius:8px;text-align:center}
  nav a[aria-current="page"]{border-top-color:var(--accent)}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dayN = s => { const [y, m, d] = s.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
const money = n => (Math.round(n * 100) / 100).toLocaleString('en', { maximumFractionDigits: 2 }) + ' ₼';
const dfmt = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; };
const UNIT = { day: 'gün', week: 'həftə', month: 'ay' };
const S = { scooters: [], contracts: [], payments: [], customers: [], cq: '', ready: {}, tab: 'umumi', cfilter: 'aktiv', pmonth: '' };
let db = null, assets = null, dl = null;
S.settings = {};
const safe = u => /^https:\/\//i.test(u || '');
const nz = x => x ? esc(x) : '<span class="muted">yazılmayıb</span>';
const snapOf = s => ({ name: s.name || '', no: s.no || '', plate: s.plate || '', bat1: s.bat1 || '', bat2: s.bat2 || '', adapter: s.adapter || '' });

/* ---------- hesablama ---------- */
function units(c) {
  if (c.handed === false) return 0;
  const end = c.status === 'baglanib' && c.closedAt ? c.closedAt : (c.end && c.end < today() ? c.end : today());
  const days = Math.max(0, dayN(end) - dayN(c.start) + 1);
  if (c.unit === 'week') return Math.ceil(days / 7);
  if (c.unit === 'month') return Math.ceil(days / 30);
  return days;
}
/* endirimdən sonrakı tarif: discType = 'percent' (%) və ya 'amount' (₼ hər dövr üçün) */
function effRate(c) {
  const r = +c.rate || 0, v = +c.discVal || 0;
  if (c.discType === 'percent') return Math.max(0, Math.round(r * (1 - Math.min(v, 100) / 100) * 100) / 100);
  if (c.discType === 'amount') return Math.max(0, Math.round((r - v) * 100) / 100);
  return r;
}
const discLabel = c => c.discType === 'percent' && +c.discVal ? '−' + (+c.discVal) + '%' : c.discType === 'amount' && +c.discVal ? '−' + money(+c.discVal) : '';
function calc(c) {
  const pays = S.payments.filter(p => p.contractId === c.id);
  const sum = k => pays.filter(p => p.kind === k).reduce((a, p) => a + (+p.amount || 0), 0);
  const due = Math.max(0, units(c) * effRate(c) - sum('güzəşt'));
  const paid = sum('kirayə');
  const dep = sum('depozit') - sum('depozit qaytarılması');
  return { pays, due, paid, debt: due - paid, dep };
}
const activeOf = id => S.contracts.find(c => c.scooterId === id && c.status === 'aktiv');
const scooterName = id => (S.scooters.find(s => s.id === id) || {}).name || 'Silinmiş skuter';
function mapLink(loc) {
  if (!loc) return '';
  const raw = (loc.coords || '').trim();
  if (/^https:\/\//i.test(raw)) return raw;
  if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(raw)) return 'https://www.google.com/maps?q=' + encodeURIComponent(raw.replace(/\s/g, ''));
  if (loc.text) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(loc.text);
  return '';
}
function status(s) {
  const ac = activeOf(s.id);
  if (ac && ac.handed === false) return ['Təhvil gözlənilir', 'warn'];
  if (ac) return ['Kirayədə', 'acc'];
  if (s.status === 'temir') return ['Təmirdə', 'warn'];
  if (s.status === 'itib') return ['İtkin', 'bad'];
  return ['Boş', 'ok'];
}

/* ---------- modal ---------- */
function openForm(title, body, onSubmit, submitLabel) {
  const m = $('#modal');
  m.innerHTML = '<form id="mf"><h2 style="margin:0">' + esc(title) + '</h2>' + body +
    '<div class="err" id="mferr" role="alert"></div><div class="row" style="justify-content:flex-end"><button type="button" id="mcancel">Ləğv et</button><button class="primary" id="msave">' + esc(submitLabel || 'Yadda saxla') + '</button></div></form>';
  m.hidden = false;
  const form = $('#mf');
  $('#mcancel').onclick = closeForm;
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = $('#msave'); btn.disabled = true; $('#mferr').textContent = '';
    try { await onSubmit(Object.fromEntries(new FormData(form)), form); closeForm(); }
    catch (er) { $('#mferr').textContent = 'Xəta: ' + (er.message || er.code || 'saxlanmadı'); btn.disabled = false; }
  };
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
  const cu = form.elements.customerId;
  if (cu && form.elements.renter && form.elements.fin) cu.onchange = () => { const x = S.customers.find(y => y.id === cu.value); if (x) { form.elements.renter.value = x.name || ''; form.elements.phone.value = x.phone || ''; form.elements.fin.value = x.fin || ''; } };
  const sc = form.elements.scooterId;
  if (sc && form.elements.rate && form.elements.unit) sc.onchange = () => { const x = S.scooters.find(y => y.id === sc.value); if (x && x.rate) { form.elements.rate.value = x.rate; form.elements.unit.value = x.unit || 'day'; } };
}
function closeForm() { const m = $('#modal'); S.sched = null; S.dsc = null; m.hidden = true; m.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });
const fld = (id, label, type, val, extra) => '<div class="f"><label for="' + id + '">' + label + '</label><input id="' + id + '" name="' + id + '" type="' + type + '" value="' + esc(val ?? '') + '" ' + (extra || '') + '></div>';
const sel = (id, label, opts, val) => '<div class="f"><label for="' + id + '">' + label + '</label><select id="' + id + '" name="' + id + '">' + opts.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select></div>';

/* ---------- formalar ---------- */
function scooterForm(s) {
  s = s || {};
  openForm(s.id ? 'Skuteri redaktə et' : 'Yeni skuter',
    fld('name', 'Ad', 'text', s.name, 'required placeholder="Skuter 1"') +
    '<div class="two">' + fld('no', 'Öz nömrəsi (daxili)', 'text', s.no, 'placeholder="1"') + fld('plate', 'Skuterin nömrəsi / seriyası', 'text', s.plate, 'placeholder="SK-000123"') + '</div>' +
    '<div class="two">' + fld('bat1', 'Batareya 1 (skuterin üstündəki)', 'text', s.bat1, 'placeholder="B-0001"') + fld('bat2', 'Batareya 2 (əlavə)', 'text', s.bat2, 'placeholder="B-0002"') + '</div>' +
    fld('adapter', 'Adaptorun nömrəsi (şarj cihazı)', 'text', s.adapter, 'placeholder="AD-0001"') +
    '<div class="two">' + fld('gpsId', 'GPS cihazının nömrəsi', 'text', s.gpsId) + fld('gpsLink', 'GPS izləmə linki (https://…)', 'url', s.gpsLink) + '</div>' +
    '<div class="two">' + fld('rate', 'Bu skuterin kirayə qiyməti (₼)', 'number', s.rate, 'min="0" step="0.01" placeholder="məs. 15"') + sel('unit', 'Hər', [['day', 'gün'], ['week', 'həftə'], ['month', 'ay']], s.unit || 'day') + '</div>' +
    '<div class="hint">Qiymət hər skuter üçün fərqli ola bilər. Müqavilə yaradanda avtomatik gəlir, orada dəyişmək olar.</div>' +
    sel('state', 'Vəziyyət', [['', 'İşlək'], ['temir', 'Təmirdə'], ['itib', 'İtkin']], s.status || '') +
    '<div class="f"><label for="note">Qeyd</label><textarea id="note" name="note" rows="2">' + esc(s.note) + '</textarea></div>' +
    '<h3 style="margin:8px 0 0">Ön sayt (müştərilər görür)</h3>' +
    '<label class="chk" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="public" value="1"' + (s.public ? ' checked' : '') + '> Bu skuteri saytda göstər</label>' +
    '<div class="f"><label for="desc">Qısa təsvir (saytda görünür)</label><textarea id="desc" name="desc" rows="3" placeholder="məs. Şəhər daxili gəzinti üçün yüngül və rahat skuter">' + esc(s.desc) + '</textarea></div>' +
    '<div class="two">' + fld('sp_range', 'Bir şarjla məsafə (km)', 'text', (s.specs || {}).range, 'placeholder="40"') + fld('sp_speed', 'Maksimum sürət (km/s)', 'text', (s.specs || {}).speed, 'placeholder="25"') + '</div>' +
    fld('sp_battery', 'Batareya', 'text', (s.specs || {}).battery, 'placeholder="48V 20Ah"') +
    ((s.photos || []).length ? '<div class="f"><label>Mövcud şəkillər (ilki əsas şəkildir; silmək üçün işarələyin)</label><div class="row" style="flex-wrap:wrap;gap:10px">' + s.photos.map((u, i) => '<label style="display:grid;gap:4px;justify-items:center;font-size:12px"><img src="' + esc(u) + '" alt="" style="width:84px;height:64px;object-fit:cover;border-radius:8px"><span><input type="checkbox" class="rmph" value="' + i + '"> sil</span></label>').join('') + '</div></div>' : '') +
    (window.skPublic ? '<div class="f"><label for="phimg">Yeni şəkillər (bir neçə seçmək olar)</label><input id="phimg" name="phimg" type="file" accept="image/*" multiple></div><div class="hint">Şəkillər avtomatik kiçildilir. İlk şəkil saytda əsas şəkil kimi görünəcək.</div>' : ''),

function viewHome() {
  const t = today(), ym = t.slice(0, 7);
  const act = S.contracts.filter(c => c.status === 'aktiv');
  const rented = S.scooters.filter(s => activeOf(s.id)).length;
  const repair = S.scooters.filter(s => !activeOf(s.id) && (s.status === 'temir' || s.status === 'itib')).length;
  const monthIncome = S.payments.filter(p => p.kind === 'kirayə' && (p.date || '').startsWith(ym)).reduce((a, p) => a + p.amount, 0);
  const calcs = act.map(c => ({ c, k: calc(c) }));
  const totalDebt = calcs.reduce((a, x) => a + Math.max(0, x.k.debt), 0);
  const deposits = S.contracts.filter(c => c.status === 'aktiv').reduce((a, c) => a + calc(c).dep, 0);
  const alerts = [];
  calcs.filter(x => x.k.debt > 0).sort((a, b) => b.k.debt - a.k.debt).forEach(x => alerts.push('<div class="alert"><span><b>' + esc(x.c.renter) + '</b> · ' + esc(scooterName(x.c.scooterId)) + '</span><span class="debt num">Borc ' + money(x.k.debt) + '</span></div>'));
  act.filter(c => c.end).forEach(c => {
    const left = dayN(c.end) - dayN(t);
    if (left < 0) alerts.push('<div class="alert"><span><b>' + esc(c.renter) + '</b> · ' + esc(scooterName(c.scooterId)) + '</span><span class="debt">Müddət ' + (-left) + ' gün əvvəl bitib</span></div>');

  });

S.tstat = ''; S.tsel = ''; S.track = null;
const hav = (a, b, c, d) => { const R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r, x = Math.sin(dl / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
function trackMsg(html) { S.tstat = html; if (S.tab === 'izleme') render(); }
const geoErr = e => e && e.code === 1 ? 'GPS icazəsi verilmədi. Telefonda bu səhifə üçün “Yer / Location” icazəsini açın, sonra yenidən yoxlayın.' : e && e.code === 2 ? 'Yer müəyyən edilə bilmədi (GPS siqnalı yoxdur). Açıq havada yoxlayın.' : e && e.code === 3 ? 'GPS vaxtında cavab vermədi. Yenidən yoxlayın.' : 'Telefonun GPS-i bu görünüşdə əlçatan deyil.';
const llink = (lat, lon) => '<a href="https://www.google.com/maps?q=' + lat.toFixed(6) + ',' + lon.toFixed(6) + '" target="_blank" rel="noopener">xəritədə aç</a>';
function myPos() {
  if (!navigator.geolocation) { trackMsg('Bu brauzerdə GPS dəstəyi yoxdur.'); return; }
  trackMsg('Yer axtarılır…');
  navigator.geolocation.getCurrentPosition(p => trackMsg('Sizin yeriniz: <b>' + p.coords.latitude.toFixed(6) + ', ' + p.coords.longitude.toFixed(6) + '</b> (±' + Math.round(p.coords.accuracy || 0) + ' m) · ' + llink(p.coords.latitude, p.coords.longitude)),
    e => trackMsg(esc(geoErr(e))), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}
function trackOff(silent) {
  if (S.track && S.track.wid != null && navigator.geolocation) navigator.geolocation.clearWatch(S.track.wid);
  S.track = null; if (!silent) trackMsg('İzləmə dayandırıldı.');
}
function trackOn(id) {
  const s = S.scooters.find(x => x.id === id);
  if (!s) return;
  if (!navigator.geolocation) { trackMsg('Bu brauzerdə GPS dəstəyi yoxdur.'); return; }
  trackOff(true);
  const T = S.track = { id, last: null, wid: null };
  trackMsg('GPS siqnalı gözlənilir… (' + esc(s.name) + ')');
  T.wid = navigator.geolocation.watchPosition(async p => {
    if (S.track !== T) return;
    const lat = p.coords.latitude, lon = p.coords.longitude, acc = Math.round(p.coords.accuracy || 0), now = Date.now(), L = T.last;
    if (L && now - L.t < 10000) return;
    if (L && hav(L.lat, L.lon, lat, lon) < 10 && now - L.t < 60000) return;
    T.last = { lat, lon, t: now };
    try {
      await db.doc('scooters/' + id).update({ loc: { text: 'Telefon GPS (±' + acc + ' m)', coords: lat.toFixed(6) + ', ' + lon.toFixed(6), at: today(), ts: now } });
      trackMsg('İzlənir: <b>' + esc(s.name) + '</b> · ' + new Date(now).toTimeString().slice(0, 5) + ' · ±' + acc + ' m · ' + llink(lat, lon) + '<br><span class="muted">Bu səhifə telefonda açıq qalmalıdır. İzləmə bölməsində yer avtomatik yenilənir.</span>');
    } catch (er) { trackMsg('Yer yazıla bilmədi: ' + esc(er.message || er.code || '')); }
  }, e => { trackMsg(esc(geoErr(e))); trackOff(true); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}

S.zones = [];
const parseXY = s => { const m = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };

  let best = null;
  for (const z of S.zones) { const d = hav(xy[0], xy[1], z.lat, z.lon) - z.r; if (!best || d < best.d) best = { d, z }; }
  return best.d <= 0 ? { st: 'in', z: best.z } : { st: 'out', z: best.z, d: Math.round(best.d) };
}

    '<div class="f"><label for="note">Qeyd</label><textarea id="note" name="note" rows="2">' + esc(x.note) + '</textarea></div>',
    async (v, form) => {
      const ns = [...form.querySelectorAll('input[name=phn]')], ls = [...form.querySelectorAll('input[name=phl]')];

  };
}
async function importCustomers() {
  const un = S.contracts.filter(c => !c.customerId && c.renter), groups = {};
  un.forEach(c => { const k = c.fin ? 'f:' + lc(c.fin) : 'n:' + lc(c.renter) + '|' + lc(c.phone); (groups[k] = groups[k] || []).push(c); });
  for (const list of Object.values(groups)) {
    const f = list.slice().sort((a, b) => (b.start || '').localeCompare(a.start || ''))[0];
    const ref = await db.collection('customers').add({ name: f.renter, phone: f.phone || '', fin: f.fin || '', address: '', note: '', createdAt: today() });
    for (const c of list) await db.doc('contracts/' + c.id).update({ customerId: ref.id });
  }
}

/* ---------- ödəniş cədvəli ---------- */
const isoOf = n => new Date(n * 864e5).toISOString().slice(0, 10);
const PLEN = { day: 1, week: 7, month: 30 };
const armedS = {};
S.method = 'nağd';
function schedule(c) {
  if (c.handed === false) return [];
  const L = PLEN[c.unit] || 1, t = dayN(today()), s0 = dayN(c.start);
  const lastDay = c.status === 'baglanib' && c.closedAt ? dayN(c.closedAt) : (c.end ? dayN(c.end) : t + L);
  const out = [];
  for (let k = 0; k < 400; k++) {
    const from = s0 + k * L;
    if (from > lastDay) break;
    const to = Math.min(from + L - 1, lastDay);
    const pay = S.payments.find(p => p.contractId === c.id && p.kind === 'kirayə' && p.period === k);
    const dp = S.payments.find(p => p.contractId === c.id && p.kind === 'güzəşt' && p.period === k);
    const base = effRate(c), amount = Math.max(0, Math.round((base - (dp ? +dp.amount || 0 : 0)) * 100) / 100);
    const free = !pay && amount === 0;
    out.push({ k, from: isoOf(from), to: isoOf(to), amount, base, dp, free, pay, late: !pay && !free && to < t, dueToday: !pay && !free && to === t });
  }
  return out;
}
const rng = r => r.from === r.to ? dfmt(r.from) : dfmt(r.from) + ' – ' + dfmt(r.to);
async function addPeriodPay(c, r, date) {
  await db.collection('payments').add({ contractId: c.id, amount: r.amount, date: date || today(), kind: 'kirayə', method: S.method || 'nağd', period: r.k, note: 'Cədvəl: ' + rng(r) });
}
async function payOldest(c) {
  const t = today(), r = schedule(c).find(x => !x.pay && !x.free && x.to <= t);
  if (r) await addPeriodPay(c, r);
}
function dueList() {
  const t = today();
  const rows = S.contracts.filter(c => c.status === 'aktiv').map(c => ({ c, due: schedule(c).filter(r => !r.pay && !r.free && r.to <= t) })).filter(x => x.due.length);

    const late = x.due.filter(r => r.to < t).length, sum = x.due.reduce((a, r) => a + r.amount, 0);

      '<div class="da">' + money(sum) + '</div><div class="row" style="flex-wrap:nowrap"><button class="sm primary pbtn" data-act="ppay" data-id="' + x.c.id + '">Ödənildi</button><button class="sm" data-act="sched" data-id="' + x.c.id + '">Cədvəl</button></div></div>';
  }).join('');
  return '<section><h3 class="ptitle">Bu gün alınacaqlar</h3><div class="hint" style="margin-bottom:10px">Ödəniş günün sonunda alınır. “Ödənildi” ən köhnə ödənilməmiş günü bu gün ödənilmiş kimi qeyd edir.</div>' +
    (rows.length ? '<div class="duegrid">' + cards + '</div>' : '<div class="empty">Bu gün ödənilməli məbləğ yoxdur.</div>') + '</section>';

function reportData() {
  const m = S.pmonth;
  return S.scooters.map(s => {
    const cs = S.contracts.filter(c => c.scooterId === s.id), act = cs.find(c => c.status === 'aktiv' && c.handed !== false);
    const wait = cs.find(c => c.status === 'aktiv' && c.handed === false);
    const earn = S.payments.filter(p => (p.kind === 'kirayə' || p.kind === 'cərimə') && (!m || (p.date || '').startsWith(m)) && cs.some(c => c.id === p.contractId)).reduce((a, p) => a + p.amount, 0);
    let lateDays = 0, lateN = 0, debt = 0, dueNow = 0;
    if (act) schedule(act).forEach(r => { if (r.late) { lateN++; lateDays += dayN(r.to) - dayN(r.from) + 1; debt += r.amount; } else if (r.dueToday) dueNow += r.amount; });
    const k = act ? calc(act) : null;
    const disc = act ? S.payments.filter(p => p.contractId === act.id && p.kind === 'güzəşt').reduce((a, p) => a + (+p.amount || 0), 0) : 0;
    return { s, act, wait, earn, lateDays, lateN, debt, dueNow, total: debt + dueNow, perDay: act ? effRate(act) / (PLEN[act.unit] || 1) : 0, accrued: k ? k.due : 0, paid: k ? k.paid : 0, bal: k ? k.debt : 0, disc };
  });
}
function verdict(x, name) {
  if (x.wait && !x.act) return ['mute', 'Müqavilə var, lakin skuter hələ təhvil verilməyib. Kirayə hesablanmır.', 0];
  if (!x.act) return ['mute', 'Skuter hazırda kirayədə deyil. Ödənilməli məbləğ yoxdur.', 0];
  if (x.total <= 0) return ['ok', 'Hər şey qaydasındadır: gecikmə və borc yoxdur, bu gün də alınacaq məbləğ yoxdur.' + (x.bal < 0 ? ' Əvvəlcədən ' + money(-x.bal) + ' ödənilib.' : ''), 0];
  const parts = [];
  if (x.debt > 0) parts.push(x.lateDays + ' gün gecikmə üzrə ' + money(x.debt) + ' borc');
  if (x.dueNow > 0) parts.push('bu gün düşən ' + money(x.dueNow));
  return [x.debt > 0 ? 'bad' : 'warn', (name ? 'İcarəçi ' : '') + 'indi ödəməlidir: ' + parts.join(' + ') + '.', x.total];
}

function render() {
  document.querySelectorAll('#nav a').forEach(a => { a.style.display = canTab(a.dataset.t) ? '' : 'none'; if (a.dataset.t === S.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (!db) { $('#app').innerHTML = '<div class="empty">Verilənlər bazası əlçatan deyil. Səhifəyə hesabınızla daxil olun.</div>'; return; }
  if (!(S.ready.scooters && S.ready.contracts && S.ready.payments)) return;
  if (!$('#modal').hidden) { /* formu pozmamaq üçün render-i yalnız fon üçün yeniləyirik */ }
  const v = { umumi: viewHome, skuterler: viewScooters, izleme: viewTracking, muqavileler: viewContracts, musteriler: viewCustomers, odenisler: viewPayments, ayarlar: viewSettings }[S.tab] || viewHome;
  $('#app').innerHTML = v();
  if (S.sched && !$('#modal').hidden) drawSched();
  if (S.dsc && !$('#modal').hidden) drawDays();
}
function route() { const h = location.hash.slice(1); S.tab = ['umumi', 'skuterler', 'izleme', 'muqavileler', 'musteriler', 'odenisler', 'ayarlar'].includes(h) && canTab(h) ? h : 'umumi'; render(); }
window.addEventListener('hashchange', route);
const armed = {};
$('#app').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.act;
  const sc = S.scooters.find(x => x.id === id), co = S.contracts.find(x => x.id === id);
  try {
    if (a === 'adds') scooterForm();
    else if (a === 'edits') scooterForm(sc);
    else if (a === 'loc') locForm(sc);
    else if (a === 'newc') contractForm(null, id);
    else if (a === 'doc') showDoc(snapOf(sc), null);
    else if (a === 'docc') showDoc(co.snap || snapOf(S.scooters.find(x => x.id === co.scooterId) || {}), co);
    else if (a === 'docr') showDoc(co.snap || snapOf(S.scooters.find(x => x.id === co.scooterId) || {}), co, 'return');
    else if (a === 'mh' || a === 'mr' || a === 'mi' || a === 'mv') mediaForm(co, { mh: 'handover', mr: 'return', mi: 'id', mv: 'renter' }[a]);
    else if (a === 'days') showDays(id);
    else if (a === 'addz') zoneForm();
    else if (a === 'editz') zoneForm(S.zones.find(q => q.id === id));
    else if (a === 'delz') {
      if (!armed['delz' + id]) { armed['delz' + id] = 1; b.textContent = 'Əminsiniz?'; setTimeout(() => { delete armed['delz' + id]; if (b.isConnected) b.textContent = 'Sil'; }, 4000); return; }
      delete armed['delz' + id]; await saveZones(S.zones.filter(q => q.id !== id));
    }
    else if (a === 'tmy') myPos();
    else if (a === 'ton') trackOn(S.tsel || (S.scooters[0] || {}).id);
    else if (a === 'toff') trackOff();
    else if (a === 'sign') signForm(co);
    else if (a === 'send') sendForm(co);
    else if (a === 'sendr') sendForm(co, 'return');
    else if (a === 'addcu') customerForm();
    else if (a === 'editcu') customerForm(S.customers.find(x => x.id === id));
    else if (a === 'cnewc') { const x = S.customers.find(y => y.id === id); contractForm({ customerId: x.id, renter: x.name, phone: x.phone, fin: x.fin }); }
    else if (a === 'cimport') { b.disabled = true; await importCustomers(); }
    else if (a === 'delcu') {
      if (!armed['delcu' + id]) { armed['delcu' + id] = 1; b.textContent = 'Əminsiniz?'; setTimeout(() => { delete armed['delcu' + id]; if (b.isConnected) b.textContent = 'Sil'; }, 4000); return; }
      delete armed['delcu' + id];
      for (const c of S.contracts.filter(c => c.customerId === id)) await db.doc('contracts/' + c.id).update({ customerId: '' });
      await db.doc('customers/' + id).delete();
    }
    else if (a === 'give') {
      if (!reqs(co).every(r => r[2])) { alert2('Əvvəlcə bütün şərtlər yerinə yetirilməlidir.'); return; }
      await db.doc('contracts/' + id).update({ handed: true, handedAt: today() });
    }
    else if (a === 'sets') settingsForm();
    else if (a === 'siteset') siteForm();
    else if (a === 'staffadd') staffForm();
    else if (a === 'staffedit') staffForm((S.staff || []).find(x => x.user_id === id));
    else if (a === 'staffrm') {
      if (!armed['staffrm' + id]) { armed['staffrm' + id] = 1; b.textContent = 'Əminsiniz?'; setTimeout(() => { delete armed['staffrm' + id]; if (b.isConnected) b.textContent = 'Sil'; }, 4000); return; }
      delete armed['staffrm' + id]; await window.skRpc('staff_remove', { p_user: id }); await loadStaff();
    }
    else if (a === 'sched') showSched(id);
    else if (a === 'ppay') await payOldest(co);
    else if (a === 'addc') contractForm();
    else if (a === 'editc') contractForm(co);
    else if (a === 'cf') { S.cfilter = b.dataset.v; render(); }
    else if (a === 'pay') payForm(id);
    else if (a === 'addp') payForm();
    else if (a === 'close' || a === 'delp') {
      if (!armed[a + id]) { armed[a + id] = 1; b.textContent = 'Əminsiniz?'; setTimeout(() => { delete armed[a + id]; if (b.isConnected) b.textContent = a === 'delp' ? 'Sil' : 'Müqaviləni bağla'; }, 4000); return; }
      delete armed[a + id];
      if (a === 'close') {
        await db.doc('contracts/' + id).update({ status: 'baglanib', closedAt: today() });
        showDoc(co.snap || snapOf(S.scooters.find(x => x.id === co.scooterId) || {}), { ...co, status: 'baglanib', closedAt: today() }, 'return');
      } else await db.doc('payments/' + id).delete();
    }
    else if (a === 'reopen') await db.doc('contracts/' + id).update({ status: 'aktiv', closedAt: '' });
  } catch (er) { alert2('Xəta: ' + (er.message || er.code)); }
});
$('#app').addEventListener('input', e => {
  if (e.target.id !== 'cq') return;
  S.cq = e.target.value; const pos = e.target.selectionStart; render();
  const n = $('#cq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} }
});
$('#app').addEventListener('change', e => { if (e.target.id === 'tsel') S.tsel = e.target.value; });
$('#app').addEventListener('change', e => { if (e.target.id === 'pm') { S.pmonth = e.target.value; render(); } });

(async function init() {
  route();
  try { db = await claude.use('db'); assets = await claude.use('assets'); dl = await claude.use('downloads'); } catch (e) { db = db || null; }
  if (!db) { render(); return; }
  setTimeout(() => { if (!(S.ready.scooters && S.ready.contracts && S.ready.payments)) $('#app').innerHTML = '<div class="empty">Məlumatlar yüklənmədi. Səhifəni yenidən açın.</div>'; }, 10000);
  db.doc('settings/zones').onSnapshot(d => { S.zones = (d.exists && (d.data().list || [])) || []; if (S.ready.scooters && S.ready.contracts && S.ready.payments) render(); }, () => {});
  loadAccess(); loadStaff();
  db.doc('settings/site').onSnapshot(d => { S.site = (d.exists && d.data()) || {}; if (S.ready.scooters && S.ready.contracts && S.ready.payments) render(); }, () => {});
  db.doc('settings/owner').onSnapshot(d => { S.settings = (d.exists && d.data()) || {}; if (S.ready.scooters && S.ready.contracts && S.ready.payments) render(); }, () => {});
  ['scooters', 'contracts', 'payments', 'customers'].forEach(n => db.collection(n).onSnapshot(snap => {
    S[n] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (n === 'scooters') S.scooters.sort((a, b) => (a.no && b.no ? String(a.no).localeCompare(String(b.no), 'az', { numeric: true }) : 0) || a.name.localeCompare(b.name, 'az', { numeric: true }));
    if (n === 'customers') S.customers.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'az'));
    S.ready[n] = true; render();
  }, er => { $('#app').innerHTML = '<div class="empty">Məlumat oxuna bilmədi: ' + esc(er.message || er.code) + '</div>'; }));
})();
</script>

</body></html>
